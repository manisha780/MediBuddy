{% extends 'main.html' %}
{% block content %}
<style>
body {
    font-family: Cambria;
    height: 100%;
    background-image: linear-gradient(#4e0374, #c37ee6);
    margin: 0;
    background-repeat: no-repeat;
    background-attachment: fixed;
}
</style>
<div class="row">
    <div class="col-md-3"></div>
    <div class="col-md-6">
        <center><h1 style="color:white;">Diabetes Predictor</h1></center>
        <div class="card card-body" style="border: 1px solid black; background-color: #daa8f4">
            <form class="form-horizontal" action="/diabetes" method="POST">
                <div class="form-group">
                    <input style="border: 1px solid black; background-color: #f0d0ff" class="form-control" type="text" name="Pregnancies" placeholder="No. of Pregnancies" value="{{ request.form.Pregnancies or '' }}">
                </div>
                <div class="form-group">
                    <input style="border: 1px solid black; background-color: #f0d0ff" class="form-control" type="text" name="Glucose" placeholder="Glucose" value="{{ request.form.Glucose or '' }}">
                </div>
                <div class="form-group">
                    <input style="border: 1px solid black; background-color: #f0d0ff" class="form-control" type="text" name="BloodPressure" placeholder="Blood Pressure (in mmHg)" value="{{ request.form.BloodPressure or '' }}">
                </div>
                <div class="form-group">
                    <input style="border: 1px solid black; background-color: #f0d0ff" class="form-control" type="text" name="SkinThickness" placeholder="Skin Thickness (in mm)" value="{{ request.form.SkinThickness or '' }}">
                </div>
                <div class="form-group">
                    <input style="border: 1px solid black; background-color: #f0d0ff" class="form-control" type="text" name="Insulin" placeholder="Insulin (in µU/ml)" value="{{ request.form.Insulin or '' }}">
                </div>
                <div class="form-group">
                    <input style="border: 1px solid black; background-color: #f0d0ff" class="form-control" type="text" name="BMI" placeholder="BMI" value="{{ request.form.BMI or '' }}">
                </div>
                <div class="form-group">
                    <input style="border: 1px solid black; background-color: #f0d0ff" class="form-control" type="text" name="DiabetesPedigreeFunction" placeholder="Diabetes Pedigree Function" value="{{ request.form.DiabetesPedigreeFunction or '' }}">
                </div>
                <div class="form-group">
                    <input style="border: 1px solid black; background-color: #f0d0ff" class="form-control" type="text" name="Age" placeholder="Age (in years)" value="{{ request.form.Age or '' }}">
                </div>

                <input style="background-color: #4e0374" type="submit" class="btn btn-info btn-block" value="Predict">
            </form>
            {% if prediction %}
    <br>
    <div class="alert alert-success" role="alert">
        <h4 style="text-align: center;">Prediction Result: {{ prediction }}</h4>
    </div>
{% endif %}
        </div>
    </div>
    <div class="col-md-3"></div>
</div>
{% endblock %}
